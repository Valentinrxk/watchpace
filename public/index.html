<!DOCTYPE html>
<html lang="es" style="background: #cfd0d6">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#cfd0d6" />
<title>watchpace</title>
<script>
  try {
    if (localStorage.getItem('vr.theme') === 'dark') {
      document.documentElement.dataset.theme = 'dark';
      document.documentElement.style.background = '#232328';
    }
  } catch (e) {}
</script>
<style>
:root {
  --silver-100:#e6e7eb; --silver-200:#dadbe0; --silver-300:#cfd0d6; --silver-400:#bfc0c7;
  --silver-500:#a6a7af; --steel-600:#75767f; --steel-700:#4c4d55; --steel-800:#35353c;
  --graphite:#232327; --red:#e10600; --bordo:#6d0f16;
  --color-bg:var(--silver-300); --color-text:var(--graphite); --color-text-dim:var(--steel-600);
  --color-border:rgba(35,35,39,.18); --color-border-strong:rgba(35,35,39,.38);
  --surface:rgba(230,231,235,.55); --hud-bg:rgba(230,231,235,.92);
  --vignette-ink:rgba(35,35,39,.16); --skel:rgba(35,35,39,.09);
  --cursor:var(--red); --cursor-halo:rgba(230,231,235,.85);
  --font-sans:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;
  --font-mono:ui-monospace,'Cascadia Mono',Consolas,'Courier New',monospace;
  --track-caps:.14em; --hud-h:46px; --frame-x:clamp(1rem,4vw,3.5rem);
  --expo:cubic-bezier(.19,1,.22,1); --smooth:cubic-bezier(.25,.46,.45,.94);
}
[data-theme='dark'] {
  --silver-100:#17171b; --silver-200:#1d1d22; --silver-300:#232328; --silver-400:#2a2a30;
  --silver-500:#4e4f57; --steel-600:#8b8c94; --steel-700:#b7b8bf; --steel-800:#cfd0d6;
  --graphite:#e2e3e7;
  --color-border:rgba(226,227,231,.15); --color-border-strong:rgba(226,227,231,.32);
  --surface:rgba(23,23,27,.5); --hud-bg:rgba(20,20,24,.92);
  --vignette-ink:rgba(0,0,0,.55); --skel:rgba(226,227,231,.08);
  --cursor:#cfd0d6; --cursor-halo:rgba(23,23,27,.85);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { background:var(--color-bg); scrollbar-width:none; }
html::-webkit-scrollbar { display:none; }
body {
  background:var(--color-bg); color:var(--color-text); font-family:var(--font-sans);
  min-height:100vh; text-transform:lowercase; -webkit-font-smoothing:antialiased; padding-bottom:7rem;
}
::selection { background:var(--red); color:#e6e7eb; }
:focus-visible { outline:1.5px solid var(--red); outline-offset:3px; }

/* ——— movimiento: corte seco, saltos, nunca blando ——— */
@keyframes grain-shift {
  0%{transform:translate3d(0,0,0)} 12.5%{transform:translate3d(-2%,-3%,0)} 25%{transform:translate3d(3%,1%,0)}
  37.5%{transform:translate3d(-1%,3%,0)} 50%{transform:translate3d(2%,-2%,0)} 62.5%{transform:translate3d(-3%,0,0)}
  75%{transform:translate3d(1%,2%,0)} 87.5%{transform:translate3d(-2%,1%,0)} 100%{transform:translate3d(0,0,0)}
}
@keyframes glitch-in {
  0%{opacity:0;transform:translate(-6px,2px);clip-path:inset(0 0 62% 0)}
  20%{opacity:1;transform:translate(4px,-2px);clip-path:inset(38% 0 0 0)}
  40%{opacity:1;transform:translate(-3px,0);clip-path:inset(0 0 24% 0)}
  60%{opacity:1;transform:translate(2px,1px);clip-path:inset(12% 0 0 0)}
  100%{opacity:1;transform:translate(0,0);clip-path:inset(0 0 0 0)}
}
@keyframes glitch-out {
  0%{opacity:1;clip-path:inset(0 0 0 0)}
  40%{opacity:.7;transform:translate(3px,0);clip-path:inset(0 0 46% 0)}
  100%{opacity:0;transform:translate(-8px,0);clip-path:inset(48% 0 48% 0)}
}
@keyframes rise-in { from{transform:translateY(110%)} to{transform:translateY(0)} }
@keyframes rule-grow { from{transform:scaleX(0)} to{transform:scaleX(1)} }
@keyframes rec-blink { 0%,55%{opacity:1} 56%,100%{opacity:.15} }
@keyframes skel-pass { from{background-position:-200% 0} to{background-position:200% 0} }

/* el sello cae de golpe y rebota una sola vez, en pasos */
@keyframes sello-golpe {
  0%   { opacity:0; transform:rotate(-14deg) scale(2.6) }
  40%  { opacity:1; transform:rotate(-14deg) scale(2.6) }
  55%  { opacity:1; transform:rotate(-9deg)  scale(.88) }
  70%  { opacity:1; transform:rotate(-9deg)  scale(1.06) }
  100% { opacity:1; transform:rotate(-9deg)  scale(1) }
}
/* un solo espasmo con split de canales, como el titulo de tu portfolio */
@keyframes espasmo {
  0%,100% { transform:none; clip-path:inset(0); filter:none }
  12% { transform:translateX(6px); clip-path:inset(6% 0 58% 0); filter:drop-shadow(-7px 0 rgba(225,6,0,.85)) }
  24% { transform:translateX(-8px); clip-path:inset(52% 0 10% 0); filter:drop-shadow(7px 0 rgba(109,15,22,.9)) }
  36% { transform:translateX(4px); clip-path:inset(24% 0 30% 0); filter:drop-shadow(-4px 0 rgba(225,6,0,.7)) }
  48% { transform:none; clip-path:inset(0); filter:none }
}

.mask { display:block; overflow:hidden; }
.mask > * { display:block; animation:rise-in .7s var(--expo) both; animation-delay:calc(var(--i,0) * 55ms); }
.enter { animation:glitch-in .42s steps(5,end) both; animation-delay:calc(var(--i,0) * 45ms); }
.leaving { animation:glitch-out .14s steps(3,end) both; }

@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

/* textura */
.film { position:fixed; inset:0; z-index:90; pointer-events:none; }
.film__grain {
  position:absolute; inset:-50%; opacity:.055; animation:grain-shift .9s steps(8) infinite;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
[data-theme='dark'] .film__grain { filter:invert(1); opacity:.09; }
.film__vig { position:absolute; inset:0; background:radial-gradient(ellipse 120% 90% at 50% 50%,transparent 68%,var(--vignette-ink) 100%); }
.film__c { position:absolute; width:14px; height:14px; border:1px solid var(--color-border-strong); }
.film__c--tl{top:calc(var(--hud-h) + 10px);left:12px;border-right:0;border-bottom:0}
.film__c--tr{top:calc(var(--hud-h) + 10px);right:12px;border-left:0;border-bottom:0}
.film__c--bl{bottom:10px;left:12px;border-right:0;border-top:0}
.film__c--br{bottom:10px;right:12px;border-left:0;border-top:0}

.caps { font-size:.6875rem; font-weight:500; letter-spacing:var(--track-caps); font-variant-numeric:tabular-nums; color:var(--color-text-dim); }
.slash { color:var(--red); font-weight:700; letter-spacing:-.12em; }

/* hud */
.hud {
  position:fixed; top:0; left:0; right:0; height:var(--hud-h); z-index:80;
  display:flex; align-items:center; justify-content:space-between; padding:0 var(--frame-x);
  background:var(--hud-bg); backdrop-filter:blur(8px); border-bottom:1px solid var(--color-border);
}
.hud__brand { display:flex; align-items:center; gap:.6rem; font-weight:700; }
.hud__brand svg { width:44px; height:38px; display:block; overflow:visible; flex:none; }
.marca {
  font-size:1.05rem; letter-spacing:-.035em; line-height:1;
  border-bottom:3px solid var(--red); padding-bottom:2px;
}
.hud__right { display:flex; align-items:center; gap:1rem; }
.tema { background:none; border:1px solid var(--color-border-strong); color:var(--color-text-dim); cursor:pointer; padding:.25rem .6rem; font:inherit; font-size:.6875rem; letter-spacing:var(--track-caps); text-transform:lowercase; transition:border-color .18s, color .18s; }
.tema:hover { border-color:var(--red); color:var(--red); }
#sync.err { border-color:var(--bordo); color:var(--bordo); }
#user { font-weight:700; color:var(--color-text); }
#user.solo { pointer-events:none; border-color:transparent; font-weight:500; color:var(--color-text-dim); }
#sync.girando { opacity:.5; }
.toast {
  position:fixed; left:50%; bottom:2rem; transform:translateX(-50%); z-index:125;
  background:var(--color-bg); border:1px solid var(--red); padding:.8rem 1.2rem;
  font-size:.75rem; letter-spacing:var(--track-caps); max-width:min(520px,92vw);
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}
.toast[hidden] { display:none; }
.rec { width:6px; height:6px; background:var(--red); border-radius:50%; opacity:0; transition:opacity .15s; }
body.pidiendo .rec { opacity:1; animation:rec-blink .5s steps(1,end) infinite; }

main { padding:calc(var(--hud-h) + 3.5rem) var(--frame-x) 0; max-width:1120px; margin:0 auto; }
section + section { margin-top:4.5rem; }
.tit { display:flex; align-items:baseline; gap:.6rem; margin-bottom:1.5rem; border-bottom:1px solid var(--color-border); padding-bottom:.5rem; }
.tit__sp { flex:1; }

/* ritmo */
.marcador { display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap; }
.marcador__n { font-size:clamp(3.5rem,11vw,7rem); font-weight:700; letter-spacing:-.05em; line-height:.85; font-variant-numeric:tabular-nums; }
.marcador__meta { font-size:clamp(1.2rem,3vw,2rem); color:var(--color-text-dim); letter-spacing:-.03em; }
.pill { display:inline-block; padding:.3rem .7rem; border:1px solid var(--red); color:var(--red); font-size:.6875rem; letter-spacing:var(--track-caps); font-variant-numeric:tabular-nums; }
.barra { position:relative; height:3px; background:var(--color-border); margin:2rem 0 .6rem; }
.barra__yo { position:absolute; inset:0 auto 0 0; background:var(--red); transform-origin:left; animation:rule-grow .9s var(--expo) both .25s; transition:width .5s var(--expo); }
.barra__hoy { position:absolute; top:-4px; bottom:-4px; width:1px; background:var(--color-text); }
.datos { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1.5rem 2rem; margin-top:2rem; }
.dato__v { font-size:1.35rem; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }

/* hero */
.hero { border:1px solid var(--color-border-strong); background:var(--surface); padding:2rem; display:flex; gap:2rem; flex-wrap:wrap; position:relative; overflow:hidden; }
.hero__bg {
  position:absolute; inset:0; background-size:cover; background-position:center 30%;
  filter:grayscale(1) contrast(1.15); opacity:.09; pointer-events:none;
  -webkit-mask-image:linear-gradient(100deg,#000 0%,transparent 72%);
  mask-image:linear-gradient(100deg,#000 0%,transparent 72%);
}
[data-theme='dark'] .hero__bg { opacity:.16; }
.hero__poster {
  position:relative; width:220px; aspect-ratio:2/3; object-fit:cover; align-self:flex-start;
  background:var(--silver-400); flex-shrink:0; border:1px solid var(--color-border);
  box-shadow:0 12px 34px rgba(35,35,39,.22);
}
.hero__body { flex:1; min-width:260px; position:relative; }
.hero__t { font-size:clamp(1.6rem,4vw,2.6rem); font-weight:700; letter-spacing:-.04em; line-height:1; }
.hero__t[data-peli]:hover { color:var(--red); }
.hero__tag { color:var(--red); font-size:.8rem; letter-spacing:var(--track-caps); margin-top:.5rem; }
.hero__sub { color:var(--color-text-dim); font-size:.88rem; margin:.7rem 0 1rem; }
.hero__sin {
  font-size:.92rem; line-height:1.55; max-width:56ch; margin-bottom:1.1rem;
  text-transform:none; color:var(--steel-700);
  display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:4; overflow:hidden;
}
.hero__cast { font-size:.75rem; color:var(--color-text-dim); margin-bottom:1.1rem; line-height:2; }
.puntaje { display:inline-flex; align-items:baseline; gap:.3rem; font-variant-numeric:tabular-nums; }
.puntaje__n { font-size:1.7rem; font-weight:700; letter-spacing:-.04em; line-height:1; }
.puntaje__d { font-size:.7rem; color:var(--color-text-dim); }
.meta-row { display:flex; align-items:center; gap:1.4rem; flex-wrap:wrap; margin-bottom:1rem; }
.donde { display:inline-flex; align-items:center; gap:.5rem; border:1px solid var(--color-border-strong); padding:.35rem .7rem; font-size:.6875rem; letter-spacing:var(--track-caps); }
.donde--si { border-color:var(--red); color:var(--red); }
.donde--no { color:var(--color-text-dim); }
.acciones { display:flex; gap:.6rem; flex-wrap:wrap; margin-top:1.4rem; }
.btn { font:inherit; font-size:.75rem; letter-spacing:var(--track-caps); text-transform:lowercase; padding:.6rem 1.1rem; border:1px solid var(--color-border-strong); background:none; color:var(--color-text); cursor:pointer; text-decoration:none; display:inline-block; transition:border-color .16s, color .16s, transform .08s var(--smooth); }
.btn:hover { border-color:var(--red); color:var(--red); }
.btn:active { transform:translateY(2px); }
.btn--p { background:var(--red); border-color:var(--red); color:#e6e7eb; font-weight:700; }
.btn--p:hover { background:var(--bordo); border-color:var(--bordo); color:#e6e7eb; }

/* listas */
.fila { display:grid; grid-template-columns:1fr auto minmax(0,auto); align-items:baseline; gap:.2rem 1rem; padding:.75rem 0; border-bottom:1px solid var(--color-border); cursor:pointer; transition:padding-left .28s var(--expo), border-color .2s; }
.fila:hover { padding-left:.8rem; border-color:var(--color-border-strong); }
.fila:hover .fila__n { color:var(--red); }
.fila__n { font-size:.95rem; transition:color .16s; overflow-wrap:anywhere; }
.fila__p { font-size:.75rem; font-variant-numeric:tabular-nums; color:var(--color-text-dim); min-width:2.2rem; text-align:right; }
.fila__d { font-size:.6875rem; letter-spacing:var(--track-caps); color:var(--color-text-dim); text-align:right; overflow-wrap:anywhere; }

/* retos */
.retos { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr)); gap:1px; background:var(--color-border); border:1px solid var(--color-border); }
.reto { background:var(--color-bg); padding:1.4rem; display:flex; flex-direction:column; gap:.5rem; }
.reto__t { font-weight:700; letter-spacing:-.02em; font-size:1.05rem; }
.reto__d { font-size:.82rem; color:var(--color-text-dim); flex:1; }
.reto__b { display:flex; align-items:center; gap:.5rem; margin-top:.4rem; }
.reto__track { flex:1; height:2px; background:var(--color-border); }
.reto__fill { height:100%; background:var(--red); transform-origin:left; animation:rule-grow .8s var(--expo) both .3s; }
.reto__cands { margin-top:.6rem; display:flex; flex-direction:column; gap:.3rem; }
.reto__c { font-size:.75rem; color:var(--color-text-dim); display:flex; justify-content:space-between; gap:.6rem; cursor:pointer; transition:color .16s, transform .2s var(--expo); }
.reto__c:hover { color:var(--red); transform:translateX(3px); }
.reto.on { outline:1px solid var(--red); outline-offset:-1px; }
.reto.hecho { outline:1px solid var(--red); outline-offset:-1px; position:relative; overflow:hidden; }
.reto.festejo { animation:espasmo .5s steps(4,end) 1; }
.reto__stamp {
  position:absolute; top:50%; left:50%; margin:-1.1rem 0 0 -4.6rem;
  width:9.2rem; text-align:center; pointer-events:none;
  border:3px solid var(--red); color:var(--red);
  font-weight:700; font-size:1.05rem; letter-spacing:.18em;
  padding:.35rem 0; opacity:.92;
  animation:sello-golpe .6s steps(6,end) both;
}
.reto.hecho.viejo .reto__stamp { display:none; }
.reto.hecho .reto__fill { background:var(--red); }
.reto__sello {
  font-size:.6875rem; letter-spacing:var(--track-caps); color:var(--red);
  font-weight:700; display:flex; align-items:center; gap:.4rem;
}
.reto__hechas { font-size:.7rem; color:var(--color-text-dim); margin-top:.2rem; line-height:1.6; }
.hito {
  border:1px solid var(--red); background:var(--surface); padding:1.2rem 1.4rem;
  display:flex; align-items:center; gap:1rem; flex-wrap:wrap; margin-bottom:1.6rem;
}
.hito__t { font-weight:700; letter-spacing:-.02em; }
.hito__d { font-size:.8rem; color:var(--color-text-dim); }
.hito--reto { border-width:2px; align-items:center; }
.festejo-gif { width:118px; height:auto; flex:none; image-rendering:pixelated; mix-blend-mode:multiply; }
[data-theme='dark'] .festejo-gif { mix-blend-mode:screen; }
.festejo-gif--noche { display:none; }
[data-theme='dark'] .festejo-gif--dia { display:none; }
[data-theme='dark'] .festejo-gif--noche { display:block; }
@media (max-width:640px) { .festejo-gif { width:88px; } }
@media (prefers-reduced-motion:reduce) { .festejo-gif { display:none !important; } }
.hito--reto .hito__t { font-size:1.35rem; line-height:1.1; }
.hito__sello {
  font-size:.6875rem; letter-spacing:var(--track-caps); color:var(--red);
  font-weight:700; margin-bottom:.35rem;
}
.hito__lista { font-size:.78rem; color:var(--color-text-dim); margin-top:.5rem; line-height:1.7; }

.chips { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.3rem; }
.chip { font:inherit; font-size:.6875rem; letter-spacing:var(--track-caps); padding:.35rem .8rem; border:1px solid var(--color-border-strong); background:none; color:var(--color-text-dim); cursor:pointer; text-transform:lowercase; transition:border-color .16s, color .16s; }
.chip:hover { color:var(--color-text); }
.chip.on { border-color:var(--red); color:var(--red); }
.aviso { border-left:2px solid var(--red); padding:1.2rem 1.4rem; background:var(--surface); }

/* ——— cursor: caret de terminal, rojo de día / plateado de noche ——— */
@media (pointer:fine) {
  * { cursor:none !important; }
}
@keyframes caret-pulse { 0%,58%{opacity:1} 59%,100%{opacity:.45} }

.wp-cursor {
  position:fixed; top:0; left:0; z-index:130; pointer-events:none;
  font-family:var(--font-mono); font-weight:700;
}
.wp-cursor__caret {
  position:absolute; font-size:15px; line-height:1; color:var(--cursor);
  transform:translate(-50%,-50%); text-shadow:0 0 5px var(--cursor-halo);
  animation:caret-pulse 1.2s steps(1,end) infinite;
  transition:transform .16s var(--expo), color .25s var(--smooth);
}
.wp-cursor.is-down .wp-cursor__caret { transform:translate(-50%,-18%) scaleY(.28); }
.wp-cursor__br {
  position:absolute; font-size:19px; line-height:1; color:var(--cursor);
  text-shadow:0 0 5px var(--cursor-halo); opacity:0;
  transform:translate(-50%,-50%);
  transition:opacity .18s var(--smooth), transform .3s var(--expo), color .25s var(--smooth);
}
.wp-cursor.is-target .wp-cursor__br { opacity:1; }
.wp-cursor.is-target .wp-cursor__br--l { transform:translate(calc(-50% - 13px),-50%); }
.wp-cursor.is-target .wp-cursor__br--r { transform:translate(calc(-50% + 13px),-50%); }
@media (prefers-reduced-motion:reduce) { .wp-cursor__caret { animation:none; } }

/* esqueleto */
.skel { background:linear-gradient(90deg,var(--skel) 25%,transparent 50%,var(--skel) 75%); background-size:200% 100%; animation:skel-pass 1.1s linear infinite; }
.skel-hero { display:flex; gap:2rem; border:1px solid var(--color-border); padding:2rem; }
.skel-l { height:.85rem; margin-bottom:.7rem; }

/* ——— panel lateral navegable ——— */
.dir-link { color:inherit; border-bottom:1px solid var(--color-border-strong); cursor:pointer; transition:color .16s, border-color .16s; }
.dir-link:hover { color:var(--red); border-color:var(--red); }

.dir-fondo { position:fixed; inset:0; z-index:100; background:var(--vignette-ink); backdrop-filter:blur(2px); opacity:0; transition:opacity .24s var(--smooth); }
.dir-fondo.on { opacity:1; }
.dir-fondo[hidden] { display:none; }

.dir-panel {
  position:fixed; top:0; right:0; bottom:0; width:min(430px,92vw); z-index:110;
  background:var(--color-bg); border-left:1px solid var(--color-border-strong);
  padding:3.2rem 1.8rem 2rem; overflow-y:auto; scrollbar-width:none;
  transform:translateX(100%); transition:transform .36s var(--expo);
  box-shadow:-24px 0 60px rgba(0,0,0,.14);
}
.dir-panel::-webkit-scrollbar { display:none; }
.dir-panel.on { transform:translateX(0); }
.dir-panel[hidden] { display:none; }
.dir-panel__volver {
  position:absolute; top:1.05rem; left:1.4rem; background:none; border:0;
  color:var(--color-text-dim); font:inherit; font-size:1.25rem; cursor:pointer; line-height:1;
  transition:color .16s, transform .2s var(--expo);
}
.dir-panel__volver:hover { color:var(--red); transform:translateX(-3px); }
.dir-panel__volver[hidden] { display:none; }
.dir-panel__x { position:absolute; top:1.05rem; right:1.3rem; background:none; border:0; color:var(--color-text-dim); font:inherit; font-size:1.35rem; cursor:pointer; line-height:1; transition:color .16s; }
.dir-panel__x:hover { color:var(--red); }
.dir-poster {
  width:120px; aspect-ratio:2/3; object-fit:cover; float:right;
  margin:0 0 1rem 1.2rem; border:1px solid var(--color-border);
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.dir-panel__t { font-size:1.6rem; font-weight:700; letter-spacing:-.04em; line-height:1.05; }
.dir-panel__sub { margin:.5rem 0 1.8rem; }
.dir-grupo { margin-bottom:1.8rem; clear:both; }
.dir-grupo > .caps { display:block; border-bottom:1px solid var(--color-border); padding-bottom:.4rem; margin-bottom:.3rem; }
.dir-vacio { font-size:.82rem; color:var(--color-text-dim); padding:.6rem 0; }


/* ——— juntos ——— */
.juntas { display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap; }
.juntas__n { font-size:clamp(3.5rem,11vw,7rem); font-weight:700; letter-spacing:-.05em; line-height:.85; font-variant-numeric:tabular-nums; }
.juntas__q { font-size:clamp(1.2rem,3vw,2rem); color:var(--color-text-dim); letter-spacing:-.03em; }
.juntas__pie { margin:1.4rem 0 .3rem; }
.ultimas-juntas { display:flex; flex-direction:column; gap:.15rem; margin-top:1.6rem; }
.uj { display:flex; align-items:baseline; gap:1rem; font-size:.8rem; padding:.3rem 0; border-bottom:1px solid var(--color-border); }
.uj__f { color:var(--color-text-dim); font-size:.6875rem; letter-spacing:var(--track-caps); min-width:5.2rem; }
.uj__n { flex:1; }
.uj__notas { color:var(--red); font-size:.75rem; letter-spacing:.02em; }
.dupla { display:flex; gap:2.5rem; flex-wrap:wrap; align-items:baseline; }
.dupla__uno { display:flex; align-items:baseline; gap:.6rem; }
.dupla__n { font-size:clamp(2.2rem,6vw,3.4rem); font-weight:700; letter-spacing:-.05em; line-height:.9; font-variant-numeric:tabular-nums; }
.dupla__meta { color:var(--color-text-dim); font-size:.95rem; }
.dupla__quien { font-size:.6875rem; letter-spacing:var(--track-caps); color:var(--color-text-dim); }

.duelo { display:grid; grid-template-columns:1fr auto 1fr; gap:.9rem; align-items:stretch; }
.duelo__vs { align-self:center; color:var(--red); font-weight:700; letter-spacing:-.06em; font-size:1rem; }
.carta {
  border:1px solid var(--color-border-strong); background:var(--surface);
  padding:.8rem; display:flex; gap:.8rem; cursor:pointer; align-items:flex-start;
  transition:border-color .18s, transform .2s var(--expo);
}
.carta:hover { border-color:var(--red); transform:translateY(-2px); }
.carta__cuerpo { min-width:0; display:flex; flex-direction:column; gap:.2rem; }
.carta__de { font-size:.625rem; letter-spacing:var(--track-caps); color:var(--red); font-weight:700; }
.carta__t { font-size:.98rem; font-weight:700; letter-spacing:-.02em; line-height:1.15; overflow-wrap:anywhere; }
.carta__sub { font-size:.7rem; color:var(--color-text-dim); }
.carta__donde { font-size:.625rem; letter-spacing:var(--track-caps); color:var(--color-text-dim); overflow-wrap:anywhere; }
.carta__donde.si { color:var(--red); }
.carta__poster { width:62px; aspect-ratio:2/3; object-fit:cover; border:1px solid var(--color-border); flex:none; }

.ruleta { border:1px solid var(--color-border-strong); background:var(--surface); padding:1.6rem; position:relative; overflow:hidden; }
.ruleta__cuantas { text-align:center; margin-bottom:1.2rem; opacity:.7; }
.ruleta__caja { min-height:212px; display:flex; align-items:center; }
.ruleta__acciones { justify-content:center; margin-top:1.4rem; }

.rl { display:grid; grid-template-columns:124px 1fr; gap:1.4rem; align-items:start; width:100%; position:relative; }
.rl__bg {
  position:absolute; inset:-1.6rem; background-size:cover; background-position:center 28%;
  filter:grayscale(1) contrast(1.15); opacity:.1; pointer-events:none; z-index:0;
  -webkit-mask-image:linear-gradient(100deg,#000 0%,transparent 78%);
  mask-image:linear-gradient(100deg,#000 0%,transparent 78%);
}
[data-theme='dark'] .rl__bg { opacity:.18; }
.rl > *:not(.rl__bg) { position:relative; z-index:1; }
.rl__tag { color:var(--red); font-size:.7rem; letter-spacing:var(--track-caps); margin-top:.45rem; overflow-wrap:anywhere; }
.rl__poster { width:124px; aspect-ratio:2/3; object-fit:cover; border:1px solid var(--color-border); display:block; }
.rl__poster--hueco { background:var(--skel); border:1px dashed var(--color-border-strong); }
.rl__cuerpo { min-width:0; }
.rl__de { color:var(--red); font-weight:700; margin-bottom:.4rem; }
.rl__t { font-size:clamp(1.15rem,2.8vw,1.75rem); font-weight:700; letter-spacing:-.04em; line-height:1.05; overflow-wrap:anywhere; }
.rl__sub { margin-top:.4rem; font-size:.78rem; color:var(--color-text-dim); overflow-wrap:anywhere; }
.rl__meta { margin-top:.8rem; }
.dir-bg {
  position:absolute; top:0; left:0; right:0; height:220px; background-size:cover; background-position:center 28%;
  filter:grayscale(1) contrast(1.15); opacity:.1; pointer-events:none; z-index:0;
  -webkit-mask-image:linear-gradient(#000,transparent);
  mask-image:linear-gradient(#000,transparent);
}
[data-theme='dark'] .dir-bg { opacity:.18; }
#dirCuerpo { position:relative; }
#dirCuerpo > *:not(.dir-bg) { position:relative; z-index:1; }
.dir-tag { color:var(--red); font-size:.7rem; letter-spacing:var(--track-caps); margin:-.3rem 0 .7rem; overflow-wrap:anywhere; }
.rl__sin {
  margin-top:.9rem; font-size:.82rem; line-height:1.55; color:var(--color-text-dim);
  display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;
}
/* corte seco: mientras gira no hay transicion, cambia y ya */
.rl--gira .rl__t { color:var(--color-text-dim); }
.rl--gira .rl__poster { opacity:.45; filter:grayscale(1); }
.rl--vacia .rl__t { color:var(--color-text-dim); font-weight:400; letter-spacing:-.02em; }
.rl--gano { cursor:pointer; }
.rl--gano .rl__t { animation:sello-golpe .5s steps(5,end) both; }
.rl--gano .rl__poster { animation:glitch-in .42s steps(5,end) both; }
.rl--gano:hover .rl__poster { border-color:var(--red); }

.par { display:flex; align-items:baseline; gap:.6rem; font-size:.75rem; color:var(--color-text-dim); }
.par b { color:var(--red); font-weight:700; }

/* --- lo nuestro --- */
.nu__primera { display:grid; grid-template-columns:auto 1fr; gap:1.5rem; align-items:center; border:1px solid var(--color-border-strong); background:var(--surface); padding:1.4rem; position:relative; overflow:hidden; cursor:pointer; }
.nu__bg {
  position:absolute; inset:0; background-size:cover; background-position:center 28%;
  filter:grayscale(1) contrast(1.15); opacity:.09; pointer-events:none;
  -webkit-mask-image:linear-gradient(100deg,#000 0%,transparent 74%);
  mask-image:linear-gradient(100deg,#000 0%,transparent 74%);
}
[data-theme='dark'] .nu__bg { opacity:.16; }
.nu__primera > *:not(.nu__bg) { position:relative; }
.nu__primera:hover { border-color:var(--red); }
.nu__poster { width:104px; height:156px; object-fit:cover; border:1px solid var(--color-border); }
.nu__cuerpo { min-width:0; }
.nu__t { font-size:clamp(1.3rem,3.4vw,2rem); font-weight:700; letter-spacing:-.04em; line-height:1.05; margin:.35rem 0 .5rem; }
.nu__fecha { color:var(--color-text-dim); font-size:.85rem; }
.nu__notas { margin-top:.7rem; font-size:.8rem; color:var(--color-text-dim); }
.nu__notas b { color:var(--color-text); font-weight:400; }

.nu__cifras { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--color-border); border:1px solid var(--color-border); border-top:0; }
.nu__c { background:var(--surface); padding:1.2rem 1rem; }
.nu__n { display:block; font-size:clamp(1.7rem,4.6vw,2.7rem); font-weight:700; letter-spacing:-.05em; line-height:.9; font-variant-numeric:tabular-nums; }
.nu__q { display:block; margin-top:.5rem; font-size:.625rem; letter-spacing:var(--track-caps); color:var(--color-text-dim); line-height:1.4; }
.nu__c em { font-style:normal; color:var(--red); }

.carta__pick { margin-top:.5rem; align-self:flex-start; background:none; border:0; padding:0; font:inherit; font-size:.6875rem; letter-spacing:var(--track-caps); color:var(--color-text-dim); text-transform:uppercase; }
.carta:hover .carta__pick, .carta__pick:hover { color:var(--red); }
.dir-dedos { display:flex; gap:.6rem; align-items:baseline; font-size:.75rem; padding:.25rem 0; }
.dir-dedos b { font-weight:700; letter-spacing:var(--track-caps); font-size:.625rem; text-transform:uppercase; min-width:3.4rem; }
.dir-dedos span { color:var(--color-text-dim); }
.nu__grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:.8rem; }
.nu__peli img { width:100%; aspect-ratio:2/3; object-fit:cover; border:1px solid var(--color-border); transition:border-color .18s, transform .22s var(--expo); display:block; }
.nu__peli:hover img { border-color:var(--red); transform:translateY(-3px); }
.nu__peli span { display:block; margin-top:.45rem; font-size:.6875rem; color:var(--color-text-dim); line-height:1.25; overflow-wrap:anywhere; }

.nu__anios { margin:1.4rem 0 .8rem; }
.nu__anio {
  display:grid; grid-template-columns:2.9rem 1fr 2.2rem; gap:.7rem;
  align-items:center; padding:.55rem 0; border-bottom:1px solid var(--color-border);
}
.nu__anio:last-child { border-bottom:0; }
.nu__anio__a { font-size:.6875rem; letter-spacing:var(--track-caps); color:var(--color-text-dim); font-variant-numeric:tabular-nums; }
.nu__anio__bar { display:flex; align-items:center; height:12px; }
.nu__anio__bar i { display:block; height:100%; background:var(--color-border-strong); }
.nu__anio__bar u { display:block; height:100%; border:1px dashed var(--red); border-left:0; opacity:.55; }
.nu__anio.es-curso .nu__anio__bar i { background:var(--red); }
.nu__anio__n { text-align:right; font-size:1rem; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.nu__anio__d { grid-column:2 / -1; font-size:.625rem; letter-spacing:var(--track-caps); color:var(--color-text-dim); margin-top:-.15rem; }
.nu__nota { opacity:.5; margin-bottom:.4rem; line-height:1.5; }
.nu__solape { margin-top:1.4rem; font-size:.9rem; line-height:1.6; color:var(--color-text-dim); }
.nu__solape b { color:var(--color-text); font-weight:400; }
.nu__solape em { font-style:normal; color:var(--red); font-weight:700; }

@media (max-width:640px) {
  .nu__cifras { grid-template-columns:1fr 1fr; }
  .nu__primera { grid-template-columns:auto 1fr; gap:1rem; padding:1rem; }
  .nu__poster { width:76px; height:114px; }
  .nu__grid { grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:.6rem; }
  .nu__anio { grid-template-columns:2.6rem 1fr 1.9rem; gap:.5rem; }
  .ruleta { padding:1.1rem; }
  .rl { grid-template-columns:88px 1fr; gap:1rem; }
  .rl__poster { width:88px; }
  .rl__sin { -webkit-line-clamp:2; font-size:.76rem; margin-top:.7rem; }
  .ruleta__caja { min-height:168px; }
  /* las dos tienen que verse juntas para poder comparar: por eso no
     apilo, achico */
  .duelo { grid-template-columns:1fr 1fr; gap:.5rem; }
  .duelo__vs { display:none; }
  .carta { flex-direction:column; padding:.6rem; gap:.45rem; }
  /* el poster recortado: lo que importa es comparar las dos, no
     mirar la tapa */
  .carta__poster { width:100%; height:112px; aspect-ratio:auto; object-position:center 22%; }
  /* en pantallas cortas el marcador no puede comerse la decision */
  #secJuntos .juntas__ultima { display:none; }
  .carta__t { font-size:.85rem; }
  .duelo + .acciones { margin-top:.8rem !important; }
  .dupla { gap:1.4rem; }
}

/* ——— responsive ——— */
@media (max-width:900px) {
  main { padding-top:calc(var(--hud-h) + 2.5rem); }
  section + section { margin-top:3.5rem; }
  .hero { gap:1.5rem; }
  .hero__poster { width:170px; }
}

@media (max-width:640px) {
  :root { --hud-h:40px; }
  body { padding-bottom:4rem; }
  .hud__brand svg { width:24px; height:24px; }
  /* el boton de cuenta tiene que sobrevivir en mobile: es la unica
     forma de cambiar de usuario. lo que se va es el nombre de la app */
  .marca { display:none; }
  .hud__brand svg { width:34px; height:29px; }
  .hud { padding:0 .9rem; }
  .hud__right { gap:.5rem; }
  .tema { padding:.25rem .45rem; }
  #user.solo { display:none; }
  #sync .largo { display:none; }
  .hero { padding:1.25rem; gap:1.1rem; }
  .hero__poster { width:96px; }
  .hero__body { min-width:0; flex-basis:100%; }
  .hero__sin { font-size:.88rem; max-width:none; }
  .meta-row { gap:.9rem; }
  .datos { grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:1.1rem 1rem; }
  .dato__v { font-size:1.1rem; }
  .fila { grid-template-columns:1fr auto; }
  .fila__d { grid-column:1 / -1; text-align:left; }
  .fila:hover { padding-left:0; }
  .reto { padding:1.1rem; }
  .tit { flex-wrap:wrap; gap:.5rem; }
  .btn { padding:.55rem .9rem; }
  .acciones { gap:.45rem; }
  .film__c { display:none; }
  .dir-panel {
    top:auto; left:0; right:0; bottom:0; width:auto; max-height:82vh;
    border-left:0; border-top:1px solid var(--color-border-strong);
    transform:translateY(100%); padding:3rem 1.2rem 1.5rem;
  }
  .dir-panel.on { transform:translateY(0); }
}

/* pantallas bajas (SE, android chico): el duelo tiene que entrar igual,
   asi que el marcador cede lo que no sirve para elegir */
@media (max-height:720px) and (max-width:640px) {
  #secJuntos { padding-top:1.2rem !important; }
  #secJuntos > .tit { display:none; }
  .juntas__n { font-size:2rem !important; }
  .juntas__pie, #dupla > .caps { font-size:.6rem; }
  .carta__poster { height:92px; }
}

@media (max-width:400px) {
  .hero { flex-direction:column; }
  .hero__poster { width:110px; }
  .acciones .btn { flex:1 1 auto; text-align:center; }
}

@media (hover:none) {
  .fila { padding:.95rem 0; }
  .reto__c { padding:.25rem 0; }
  .fila:hover { padding-left:0; }
  .fila:hover .fila__n { color:inherit; }
}
</style>

<body>

        <text x="1" y="11" xml:space="preserve">   .==#%#==.</text>

<script>
const $ = (id) => document.getElementById(id);
const IMG = "https://image.tmdb.org/t/p/w342";
const dormir = (ms) => new Promise((r) => setTimeout(r, ms));
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
const INTERACTIVO = "a,button,[data-a],[data-min],[data-persona],[data-peli],.fila,.reto__c,.chip,.dir-link,.rl--gano";

let minutos = null, data = null, primera = true, numeroActual = 0, retoOffset = 0, peticion = 0, pila = [];

/* el servidor local persiste en disco; el deploy serverless no tiene disco,
   asi que el estado viaja con cada request y vuelve para guardarse aca */
let usuario = new URLSearchParams(location.search).get("u") || null;
const LS = () => `wp.estado.${usuario ?? "default"}`;
const leerEstadoLocal = () => { try { return JSON.parse(localStorage.getItem(LS())) ?? {}; } catch (e) { return {}; } };
const guardarEstadoLocal = (e) => { try { localStorage.setItem(LS(), JSON.stringify(e ?? {})); } catch (err) {} };

/* un reto se festeja una sola vez: despues queda como logro, sin sello */
const yaFestejado = (id) => { try { return localStorage.getItem(`wp.festejo.${usuario}.${id}`) === "1"; } catch (e) { return true; } };
const marcarFestejado = (id) => { try { localStorage.setItem(`wp.festejo.${usuario}.${id}`, "1"); } catch (e) {} };

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fecha = (iso) => iso ? new Date(iso + "T12:00:00").toLocaleDateString("es-AR", { day: "numeric", month: "long" }) : "—";
const cada = (r) => r > 0 ? `1 cada ${(1 / r).toFixed(1)} días` : "—";
const estrellas = (r) => (r ? "★".repeat(Math.round(r)) + " · " : "");
const fechaCorta = (iso) => iso || "sin fecha";
const nota = (n) => n ?? "—";

const hace = (iso) => {
  if (!iso) return "sin sincronizar";
  const min = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return "recién";
  if (min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60);
  if (h < 24) return `hace ${h} h`;
  return `hace ${Math.floor(h / 24)} días`;
};

let tToast = null;
const avisar = (txt) => {
  const t = $("toast");
  t.textContent = txt;
  t.hidden = false;
  clearTimeout(tToast);
  tToast = setTimeout(() => (t.hidden = true), 6000);
};

const donde = (f) => {
  if (f.dondeTipo === "sub" || f.dondeTipo === "gratis") return { txt: f.donde.join(", "), si: true };
  if (f.dondeTipo === "addon") return { txt: "add-on aparte", si: false };
  if (f.dondeTipo === "alquiler") return { txt: "solo alquiler", si: false };
  return { txt: "no está en streaming", si: false };
};

const personaChip = (p) => (p.id ? `<span class="dir-link" data-persona="${p.id}">${esc(p.nombre)}</span>` : esc(p.nombre));

const filaPeli = (f, derecha, i = 0) => `<div class="fila enter" style="--i:${i}" data-peli="${esc(f.nombre)}" data-anio="${f.anio}">
    <span class="fila__n">${esc(f.nombre)} <span style="color:var(--color-text-dim)">(${f.anio})</span></span>
    <span class="fila__p">${nota(f.puntaje)}</span>

const ventanaRetos = () => {
  const n = data.retos.length;
  if (!n) return [];
  retoOffset = ((retoOffset % n) + n) % n;
  return Array.from({ length: Math.min(3, n) }, (_, i) => data.retos[(retoOffset + i) % n]);
};

const contarHasta = (el, destino) => {
  const desde = numeroActual;
  numeroActual = destino;
  if (suave || desde === destino) return (el.textContent = destino);
  const pasos = 14, t0 = performance.now(), dur = 620;
  /* red de seguridad: si rAF no corre (pestaña oculta, sin compositing)
     el numero igual termina en su valor y no queda a mitad de camino */
  const red = setTimeout(() => { el.textContent = destino; }, dur + 120);

  const tic = (t) => {
    const p = Math.min(1, (t - t0) / dur);
    el.textContent = Math.round(desde + (destino - desde) * (Math.floor(p * pasos) / pasos));
    if (p < 1) requestAnimationFrame(tic);
    else { clearTimeout(red); el.textContent = destino; }
  };
  requestAnimationFrame(tic);
};

const pedir = async (accion, extra = {}) => {
  const mia = ++peticion;
  document.body.classList.add("pidiendo");

  const hero = document.querySelector(".hero");
  const salida = hero && !suave ? (hero.classList.add("leaving"), dormir(140)) : Promise.resolve();

  const [r] = await Promise.all([
    fetch("/api/estado", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ minutos, accion, ...extra, usuario, estado: leerEstadoLocal() }),
    }),
    salida,
  ]);
  const recibido = await r.json();
  if (mia !== peticion) return;

  data = recibido;
  guardarEstadoLocal(recibido.estado);
  document.body.classList.remove("pidiendo");
  pintar();
};

/* el bolillero ya viene barajado del servidor: cada tirada avanza uno
   localmente. antes pedia al servidor al terminar, y ese re-render
   borraba la ganadora justo despues de mostrarla. */
let giroIdx = 0;

/* las tapas tienen que estar en cache antes de girar, si no el carrete
   parpadea en blanco mientras las baja */
const BACKDROP = "https://image.tmdb.org/t/p/w780";

const precargarPosters = () => {
  for (const f of (data.giro ?? []).slice(0, 16)) {
    if (f.poster) { const i = new Image(); i.src = IMG + f.poster; }
    if (f.backdrop) { const b = new Image(); b.src = BACKDROP + f.backdrop; }
  }
};

  return `<div class="rl${girando ? " rl--gira" : ""}">
    ${f.backdrop ? `<div class="rl__bg" style="background-image:url('${BACKDROP}${f.backdrop}')"></div>` : ""}
    ${f.poster
      ? `<img class="rl__poster" src="${IMG}${f.poster}" alt="" onerror="this.classList.add('rl__poster--hueco')">`
      : `<div class="rl__poster rl__poster--hueco"></div>`}
    <div class="rl__cuerpo">
      ${f.de ? `<div class="caps rl__de">la quiere ${esc(f.de)}</div>` : ""}
      <div class="rl__t">${esc(f.nombre)}</div>
      ${!girando && f.tagline ? `<div class="rl__tag">${esc(f.tagline)}</div>` : ""}
      <div class="rl__sub">${f.anio}${f.minutos ? ` · ${f.minutos} min` : ""}${(f.generos ?? []).length ? ` · ${esc(f.generos.slice(0, 2).join("/"))}` : ""}${f.director ? ` · ${esc(f.director)}` : ""}</div>
      ${girando ? "" : `<div class="meta-row rl__meta">
        ${f.puntaje ? `<span class="puntaje"><span class="puntaje__n">${f.puntaje}</span><span class="puntaje__d">/10</span></span>` : ""}
        <span class="donde ${w.si ? "donde--si" : "donde--no"}">${esc(w.txt)}</span>
      </div>
      ${f.sinopsis ? `<p class="rl__sin">${esc(f.sinopsis)}</p>` : ""}`}
    </div>
  </div>`;
};

const girarRuleta = async () => {
  const v = $("ventana");
  const boton = $("girar");
  if (!data.giro.length || boton.disabled) return;

  boton.disabled = true;
  $("ruletaAcciones").querySelectorAll(".btn:not(#girar)").forEach((b) => b.remove());

  const ganadora = data.giro[giroIdx % data.giro.length];
  giroIdx++;

  /* el carrete muestra tapa y titulo: mirar pasar las posibilidades es
     la mitad de la gracia */
  const paso = data.giro.filter((f) => f !== ganadora);
  for (let i = 0; i < 14; i++) {
    v.innerHTML = fichaRuleta(paso[(giroIdx * 7 + i) % paso.length], true);
    await dormir(60 + i * 16);
  }

  v.innerHTML = fichaRuleta(ganadora);
  v.querySelector(".rl").classList.add("rl--gano");
  v.querySelector(".rl").dataset.peli = ganadora.nombre;
  v.querySelector(".rl").dataset.anio = ganadora.anio;

  boton.disabled = false;
  boton.textContent = "otra vez";
  boton.insertAdjacentHTML("beforebegin",
    `<button class="btn btn--p" data-a="acepto" data-n="${esc(ganadora.nombre)}">va esta</button>`);
  boton.classList.remove("btn--p");
};

const pintar = () => {
  if (data.tipo === "juntos") return pintarJuntos();
  document.querySelectorAll("#app > section").forEach((sec) => (sec.hidden = false));
  $("secJuntos").hidden = true;
  $("secJuntos").innerHTML = SECCION_JUNTOS;   /* no dejar dom viejo colgando */

  const r = data.ritmo;
  $("boot").hidden = true;
  $("app").hidden = false;
  usuario = data.usuario;
  const todos = [...(data.usuarios ?? []), { usuario: "juntos", nombre: "juntos" }]
    .filter((u, i, a) => a.findIndex((x) => x.usuario === u.usuario) === i);
  const i = todos.findIndex((u) => u.usuario === data.usuario);
  const otros = [todos[(i + 1) % todos.length]];
  $("user").textContent = data.nombre ?? data.usuario;
  $("user").classList.toggle("solo", !otros.length);
  $("user").title = otros.length ? `ver lo de ${otros[0].nombre}` : `@${data.usuario}`;
  $("user").dataset.otro = otros[0]?.usuario ?? "";

  const s = data.sync ?? {};
  $("sync").innerHTML = `↻ <span class="largo">${s.error ? "falló" : esc(hace(s.ultima))}</span>`;
  $("sync").classList.toggle("err", Boolean(s.error));
  $("sync").title = s.error
    ? `último intento ${hace(s.ultimoIntento)}: ${s.error}`
    : `letterboxd sincronizado ${hace(s.ultima)}. click para traer ahora.`;

  contarHasta($("vistas"), r.vistas);
  $("meta").textContent = r.meta;
  $("estado").textContent = r.alDia ? `${-r.deficit} adelantado` : `${r.deficit} atrasado`;
  $("barraYo").style.width = Math.min(100, (r.vistas / r.meta) * 100) + "%";
  $("barraHoy").style.left = ((r.transcurridos / (r.transcurridos + r.restantes)) * 100) + "%";
  $("barraPie").textContent = `faltan ${r.faltan} en ${r.restantes} días · la línea marca dónde deberías ir hoy`;

  if (primera) {
    $("datos").innerHTML = [["tu ritmo", cada(r.ritmoActual)], ["necesario", cada(r.ritmoNecesario)],
      ["proyección", r.proyeccion], ["tocás la meta", fecha(r.fechaMeta)], ["watchlist", r.pendientes]]
      .map(([k, v], i) => `<div><div class="caps">${k}</div><span class="mask" style="--i:${i + 3}"><span class="dato__v">${v}</span></span></div>`).join("");
    $("chips").innerHTML = [[null, "cualquiera"], [90, "tengo 90 min"], [120, "tengo 2 horas"], [180, "tengo la tarde"]]
      .map(([v, t]) => `<button class="chip" data-min="${v ?? ""}">${t}</button>`).join("");
  }
  [...$("chips").children].forEach((c) => c.classList.toggle("on", (c.dataset.min ? Number(c.dataset.min) : null) === minutos));

  pintarHoy();

  $("alternativas").innerHTML = data.alternativas
    .map((f, i) => filaPeli(f, `${f.minutos ? f.minutos + " min · " : ""}${esc(donde(f).txt)}`, i + 1))
    .join("");

  $("secRetos").hidden = !data.retos.length;
  $("retosCuenta").textContent = `${Math.min(3, data.retos.length)} de ${data.retos.length}`;
  $("retosRefresh").hidden = data.retos.length <= 3;
  $("retos").innerHTML = ventanaRetos().map((t, i) => `
    <div class="reto enter ${t.completado ? "hecho" : t.activo ? "on" : ""}${t.completado && yaFestejado(t.id) ? " viejo" : ""}" data-reto="${esc(t.id)}" style="--i:${i}">
      <div class="reto__t">${esc(t.titulo)}</div>
      <div class="reto__d">${esc(t.detalle)}</div>
      <div class="reto__b"><div class="reto__track"><div class="reto__fill" style="width:${Math.min(100, (t.progreso / t.objetivo) * 100)}%"></div></div>
        <span class="caps">${t.progreso}/${t.objetivo}</span></div>
      ${t.completado && !yaFestejado(t.id) ? `<div class="reto__stamp">cumplido</div>` : ""}
      ${t.completado
        ? `<div class="reto__sello">✓ cumplido</div>
           <div class="reto__hechas">${(t.hechas ?? []).slice(0, 4).map((f) => esc(f.nombre)).join(" · ")}</div>`
        : t.activo
          ? `<div class="reto__hechas">${t.hechas?.length ? `vas por: ${t.hechas.map((f) => esc(f.nombre)).join(" · ")}` : `aceptado el ${t.desde}. todavía ninguna.`}</div>`
          : t.candidatas.length ? `<div class="reto__cands">${t.candidatas.map((c) => {
              const w = donde(c);
              return `<span class="reto__c" data-peli="${esc(c.nombre)}" data-anio="${c.anio}"><span>${esc(c.nombre)}</span><span style="${w.si ? "color:var(--red)" : ""}">${esc(w.txt)}</span></span>`;
            }).join("")}</div>` : ""}
      <div class="acciones" style="margin-top:1rem">
        ${t.completado
          ? `<button class="btn" data-a="reto-paso" data-r="${esc(t.id)}">listo, archivar</button>`
          : `<button class="btn ${t.activo ? "btn--p" : ""}" data-a="reto-acepto" data-r="${esc(t.id)}">${t.activo ? "abandonar" : "va"}</button>
             <button class="btn" data-a="reto-paso" data-r="${esc(t.id)}">paso</button>`}
      </div>
    </div>`).join("");

  /* el reto recien cumplido merece un momento, no una tarjeta mas */
  const logro = data.retos.find((t) => t.completado && !yaFestejado(t.id));
  $("retoLogro").innerHTML = logro
    ? `<div class="hito hito--reto enter">
         <img class="festejo-gif festejo-gif--dia" src="/monito-festeja.gif" alt="" aria-hidden="true">
         <img class="festejo-gif festejo-gif--noche" src="/monito-festeja-noche.gif" alt="" aria-hidden="true">
         <div style="flex:1;min-width:200px">
           <div class="hito__sello">reto cumplido</div>
           <div class="hito__t">${esc(logro.titulo)}</div>
           <div class="hito__lista">${(logro.hechas ?? []).map((f) => esc(f.nombre)).join(" · ")}</div>
         </div>
         <button class="btn btn--p" data-festejo="${esc(logro.id)}">buenísimo</button>
       </div>`
    : "";
  if (logro) {
    const tarjeta = document.querySelector(`.reto[data-reto="${CSS.escape(logro.id)}"]`);
    if (tarjeta && !suave) { tarjeta.classList.add("festejo"); setTimeout(() => tarjeta.classList.remove("festejo"), 600); }
  }

  $("ultimas").innerHTML = data.ultimas
    .map((f, i) => filaPeli({ ...f, puntaje: null }, `${estrellas(f.rating)}${fechaCorta(f.visto)}`, i))
    .join("");

  primera = false;
};

/* ——— panel navegable: persona <-> pelicula ——— */
const dirPanel = $("dirPanel"), dirFondo = $("dirFondo");

const cerrarPanel = () => {
  dirPanel.classList.remove("on");
  dirFondo.classList.remove("on");
  pila = [];
  setTimeout(() => { dirPanel.hidden = true; dirFondo.hidden = true; }, 360);
};

const htmlPersona = (d) => `
  <div class="dir-panel__t">${esc(d.nombre)}</div>
  <div class="dir-panel__sub caps">${d.pendientes.length} pendiente${d.pendientes.length === 1 ? "" : "s"} · ${d.vistas.length} vista${d.vistas.length === 1 ? "" : "s"}</div>

  <div class="dir-grupo">
    <span class="caps">en tu watchlist</span>
    ${d.pendientes.length
      ? d.pendientes.map((f, i) => filaPeli(f, esc(donde(f).txt), i)).join("")
      : `<div class="dir-vacio">ninguna pendiente.</div>`}
  </div>

  <div class="dir-grupo">
    <span class="caps">ya viste</span>
    ${d.vistas.length
      ? d.vistas.map((f, i) => filaPeli(f, `${estrellas(f.miRating)}${fechaCorta(f.visto)}`, i)).join("")
      : `<div class="dir-vacio">ninguna todavía.</div>`}
  </div>

  <a class="btn" href="${esc(d.letterboxd)}" target="_blank" rel="noopener">${d.slugExacto ? "ver en letterboxd" : "buscar en letterboxd"}</a>`;

const htmlPelicula = (d) => {
  if (!d.resuelta)
    return `<div class="dir-panel__t">${esc(d.nombre)} <span style="color:var(--color-text-dim)">(${d.anio})</span></div>
      <div class="dir-vacio">no la encontré en tmdb, así que no tengo datos suyos.</div>`;

  const w = donde(d);
  const suyo = (p) => p.vista
    ? `la vio${p.visto ? ` el ${p.visto}` : ""}${p.rating ? ` · ${"★".repeat(Math.round(p.rating))}` : " · sin puntuar"}`
    : p.enWatchlist ? "la tiene pendiente" : "no la tiene anotada";
  const estado = d.dedos
    ? d.dedos.map((p) => `<div class="dir-dedos"><b>${esc(p.nombre)}</b><span>${esc(suyo(p))}</span></div>`).join("")
    : `<div class="caps">${d.vista
        ? `la viste${d.visto ? ` el ${d.visto}` : ""}${d.miRating ? ` · le pusiste ${"★".repeat(Math.round(d.miRating))}` : " · sin puntuar"}`
        : d.enWatchlist ? "pendiente en tu watchlist" : "no está en tu watchlist"}</div>`;

  return `
  ${d.backdrop ? `<div class="dir-bg" style="background-image:url('${BACKDROP}${d.backdrop}')"></div>` : ""}
  ${d.poster ? `<img class="dir-poster" src="${IMG}${d.poster}" alt="" onerror="this.remove()">` : ""}
  <div class="dir-panel__t">${esc(d.nombre)}</div>
  ${d.tagline ? `<div class="dir-tag">${esc(d.tagline)}</div>` : ""}
  <div class="dir-panel__sub caps">${d.anio}${d.minutos ? ` · ${d.minutos} min` : ""}${d.generos.length ? ` · ${esc(d.generos.join("/"))}` : ""}</div>

  <div class="meta-row" style="margin-bottom:1.1rem">
    ${d.puntaje ? `<span class="puntaje"><span class="puntaje__n">${d.puntaje}</span><span class="puntaje__d">/10</span></span>` : ""}
    <span class="donde ${w.si ? "donde--si" : "donde--no"}">${esc(w.txt)}</span>
  </div>

  <div style="margin-bottom:1.2rem">${estado}</div>
  ${d.sinopsis ? `<p class="hero__sin" style="-webkit-line-clamp:8;max-width:none">${esc(d.sinopsis)}</p>` : ""}

  ${d.directorNombre ? `<div class="dir-grupo"><span class="caps">dirección</span>
      <div style="padding:.6rem 0">${d.directorId ? `<span class="dir-link" data-persona="${d.directorId}">${esc(d.directorNombre)}</span>` : esc(d.directorNombre)}</div></div>` : ""}

  ${d.reparto.length ? `<div class="dir-grupo"><span class="caps">reparto</span>
      <div style="padding:.6rem 0;line-height:2.1">${d.reparto.map(personaChip).join(" · ")}</div></div>` : ""}

  <div class="acciones">
    ${d.dedos ? `<button class="btn btn--p" data-a="acepto" data-n="${esc(d.nombre)}" data-cierra="1">esta ven hoy</button>`
      : d.enWatchlist ? `<button class="btn btn--p" data-a="elegir" data-n="${esc(d.nombre)}" data-cierra="1">ver esta hoy</button>` : ""}
    ${d.uri ? `<a class="btn" href="${esc(d.uri)}" target="_blank" rel="noopener">letterboxd</a>` : ""}
  </div>`;
};

const navegar = async (entrada, esVuelta = false) => {
  if (!esVuelta) pila.push(entrada);

  if (dirPanel.hidden) {
    dirPanel.hidden = false;
    dirFondo.hidden = false;
    void dirPanel.offsetWidth;
    dirPanel.classList.add("on");
    dirFondo.classList.add("on");
  }

  const cuerpo = $("dirCuerpo");
  cuerpo.innerHTML = `<div class="caps">buscando…</div>`;
  dirPanel.scrollTop = 0;

  const u = usuario ? `&u=${encodeURIComponent(usuario)}` : "";
  const url = entrada.tipo === "persona"
    ? `/api/persona?id=${encodeURIComponent(entrada.id)}${u}`
    : `/api/pelicula?nombre=${encodeURIComponent(entrada.nombre)}&anio=${entrada.anio}${u}`;

  const d = await fetch(url).then((r) => r.json()).catch(() => null);
  $("dirVolver").hidden = pila.length < 2;

  cuerpo.innerHTML = !d || d.error
    ? `<div class="dir-panel__t">no pude cargarlo</div><div class="dir-vacio">probá de nuevo.</div>`
    : d.tipo === "persona" ? htmlPersona(d) : htmlPelicula(d);
};

const volver = () => {
  pila.pop();
  const anterior = pila[pila.length - 1];
  if (anterior) navegar(anterior, true);
  else cerrarPanel();
};

$("dirCerrar").addEventListener("click", cerrarPanel);
$("dirVolver").addEventListener("click", volver);
dirFondo.addEventListener("click", cerrarPanel);
addEventListener("keydown", (e) => { if (e.key === "Escape" && !dirPanel.hidden) cerrarPanel(); });

$("retosRefresh").addEventListener("click", async () => {
  const caja = $("retos");
  if (!suave) { caja.classList.add("leaving"); await dormir(140); caja.classList.remove("leaving"); }
  retoOffset += 3;
  pintar();
});

document.addEventListener("click", (e) => {
  if (e.target.closest("#retosRefresh") || e.target.closest("#dirCerrar") || e.target.closest("#dirVolver")) return;

  const fest = e.target.closest("[data-festejo]");
  if (fest) {
    marcarFestejado(fest.dataset.festejo);
    pintar();
    return;
  }

  const ok = e.target.closest("[data-ok]");
  if (ok) {
    const [peli, visto] = ok.dataset.ok.split("|");
    try { localStorage.setItem("wp.visto." + peli, visto); } catch (err) {}
    ok.closest(".hito")?.remove();
    return;
  }

  const el = e.target.closest("[data-a]");
  if (el && el.tagName !== "A") {
    e.preventDefault();
    if (el.dataset.cierra) cerrarPanel();
    return pedir(el.dataset.a, { nombre: el.dataset.n, retoId: el.dataset.r });
  }

  const per = e.target.closest("[data-persona]");
  if (per) return navegar({ tipo: "persona", id: per.dataset.persona });

  const pel = e.target.closest("[data-peli]");
  if (pel) return navegar({ tipo: "pelicula", nombre: pel.dataset.peli, anio: Number(pel.dataset.anio) });

  const md = e.target.closest("[data-modo]");
  if (md) return pedir("modo", { nombre: md.dataset.modo });

  const chip = e.target.closest("[data-min]");
  if (chip) { minutos = chip.dataset.min ? Number(chip.dataset.min) : null; return pedir(null); }
});

$("user").addEventListener("click", () => {
  const otro = $("user").dataset.otro;
  if (!otro) return;
  usuario = otro;
  retoOffset = 0;
  primera = true;
  numeroActual = 0;
  history.replaceState(null, "", `?u=${encodeURIComponent(otro)}`);
  pedir(null);
});

$("sync").addEventListener("click", async () => {
  const b = $("sync");
  b.classList.add("girando");
  document.body.classList.add("pidiendo");
  try {
    const r = await fetch("/api/sync", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ minutos, usuario, estado: leerEstadoLocal() }),
    }).then((x) => x.json());
    const res = r.resultadoSync ?? {};
    data = r;
    guardarEstadoLocal(r.estado);
    pintar();
    if (!res.ok) avisar(`no pude hablar con letterboxd: ${res.error}`);
    else if (res.cumplido) avisar(`viste ${res.cumplido}, la que habías planificado. anotada.`);
    else if (res.nuevas?.length) avisar(`${res.nuevas.length} nueva${res.nuevas.length === 1 ? "" : "s"}: ${res.nuevas.map((f) => f.nombre).join(", ")}`);
    else avisar("nada nuevo en letterboxd desde la última vez.");
  } finally {
    b.classList.remove("girando");
    document.body.classList.remove("pidiendo");
  }
});

$("tema").addEventListener("click", () => {
  const oscuro = document.documentElement.dataset.theme === "dark";
  if (oscuro) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = "dark";
  document.documentElement.style.background = oscuro ? "#cfd0d6" : "#232328";
  $("tema").textContent = oscuro ? "noche" : "día";
  try { localStorage.setItem("vr.theme", oscuro ? "light" : "dark"); } catch (e) {}
});
if (document.documentElement.dataset.theme === "dark") $("tema").textContent = "día";

const montarCursor = () => {
  const fino = matchMedia("(pointer: fine)");
  const el = $("cursor");
  let raf = null, x = -100, y = -100, mx = -100, my = -100;

  const loop = () => {
    x += (mx - x) * 0.3;
    y += (my - y) * 0.3;
    el.style.transform = `translate3d(${x}px,${y}px,0)`;
    raf = requestAnimationFrame(loop);
  };
  const mover = (e) => { mx = e.clientX; my = e.clientY; };
  const encima = (e) => el.classList.toggle("is-target", Boolean(e.target.closest(INTERACTIVO)));
  const abajo = () => el.classList.add("is-down");
  const arriba = () => el.classList.remove("is-down");

  const encender = () => {
    el.hidden = false;
    addEventListener("mousemove", mover, { passive: true });
    document.addEventListener("mouseover", encima);
    addEventListener("mousedown", abajo);
    addEventListener("mouseup", arriba);
    raf ??= requestAnimationFrame(loop);
  };
  const apagar = () => {
    el.hidden = true;
    removeEventListener("mousemove", mover);
    document.removeEventListener("mouseover", encima);
    removeEventListener("mousedown", abajo);
    removeEventListener("mouseup", arriba);
    if (raf) { cancelAnimationFrame(raf); raf = null; }
  };

  fino.matches ? encender() : apagar();
  fino.addEventListener("change", (e) => (e.matches ? encender() : apagar()));
};
montarCursor();

pedir(null);
</script>
