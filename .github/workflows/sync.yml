name: sync

# el sync vivia en una tarea programada de windows: si la notebook estaba
# apagada, produccion se quedaba congelada. aca corre igual siempre.
on:
  schedule:
    # cada 2 horas. el sync son 2 pedidos y tarda menos de un segundo, asi
    # que no hay razon para espaciarlo: dos veces por dia significaba ver
    # una peli, logearla, y que la app se enterara a la noche.
    #
    # el minuto 17 es a proposito: github encola los cron y los que caen
    # en punto llegan con horas de atraso (los de "0 11" venian
    # disparando 14:52).
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      prueba:
        description: "correr sin publicar (solo mira si letterboxd responde)"
        type: boolean
        default: false

# el push del sync no dispara este workflow (solo corre por schedule o a
# mano), asi que no hay loop. el concurrency es para que una corrida
# manual no se pise con la programada.
concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # el proyecto no tiene dependencias de runtime, asi que no hay
      # npm install: se corre el script y ya.

      - name: quien commitea
        run: |
          git config user.name "watchpace"
          git config user.email "82244733+Valentinrxk@users.noreply.github.com"

      - name: sincronizar
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          # sin esto el push llega a github pero vercel no lo construye:
          # el plan hobby ignora los commits que no son de un colaborador
          # del proyecto, y aca el que pushea es github-actions[bot].
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          WATCHPACE_DEPLOY: ${{ inputs.prueba && '0' || '1' }}
        run: node scripts/sync.mjs
